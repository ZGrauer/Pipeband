<div class="container">
    <div class="main-content">        
          <mat-card>
            <mat-card-header>
                <mat-card-title>Login</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <!-- Lockout Warning -->
                <div *ngIf="isLockedOut" class="lockout-message">
                    <mat-icon color="warn">lock</mat-icon>
                    <p><strong>Account Temporarily Locked</strong></p>
                    <p>Too many failed login attempts. Please try again in {{ lockoutTimeRemaining }} minute(s).</p>
                </div>

                <form class="form" #f="ngForm" *ngIf="!isLockedOut">
                    <div class="form-group">
                        <mat-form-field appearance="fill">
                            <mat-label>Enter your password</mat-label>
                            <input matInput [(ngModel)]="userPassword" #password="ngModel" name="password"
                                [type]="hide ? 'password' : 'text'" [disabled]="isLockedOut">
                            <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                                [attr.aria-pressed]="hide" type="button">
                                <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                            </button>
                        </mat-form-field>
                    </div>

                    <button mat-raised-button color="primary" [disabled]="!f.form.valid || isLockedOut" type="button"
                        (click)="loginUser()" class="btn btn-success float-right">
                        Submit
                    </button>
                    
                    <!-- Error Messages -->
                    <div class="error-messages">
                        <p *ngIf="invalidPassword" class="error-text">
                            <mat-icon color="warn" class="error-icon">error</mat-icon>
                            <strong>Error!</strong> Invalid password
                        </p>
                        <p *ngIf="invalidPassword && loginAttempts > 0" class="warning-text">
                            {{ getRemainingAttempts() }} attempt(s) remaining before temporary lockout
                        </p>
                    </div>
                </form>
            </mat-card-content>
        </mat-card>        
    </div>
    <div class="left-article">
    </div>
    <div class="right-article">
    </div>
</div>
