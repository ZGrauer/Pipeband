<div class="columns">
    <section>
        <h3>Officers</h3>
        <mat-list>
            <mat-list-item *ngFor="let officer of officers">
                <span matListItemTitle>{{ officer.name }}</span>
                <span matListItemLine>{{ officer.roles.join(' · ') }}</span>
                <a matListItemMeta mat-icon-button [href]="'mailto:' + officer.email" [matTooltip]="officer.email" [attr.aria-label]="'Email ' + officer.name">
                    <mat-icon>mail</mat-icon>
                </a>
            </mat-list-item>
        </mat-list>
    </section>

    <section>
        <h3>Documents</h3>
        <!-- Plain rows rather than mat-list so long titles wrap instead of truncating on phones -->
        <div class="doc-row" *ngFor="let doc of documents">
            <mat-icon class="doc-icon">{{ doc.icon }}</mat-icon>
            <div class="doc-text">
                <div class="doc-title">{{ doc.title }}</div>
                <div class="doc-description">{{ doc.description }}</div>
            </div>
            <span class="actions">
                <button mat-icon-button *ngIf="doc.viewable" (click)="view(doc)" matTooltip="View" [attr.aria-label]="'View ' + doc.title"><mat-icon>visibility</mat-icon></button>
                <button mat-icon-button (click)="download(doc)" matTooltip="Download" [attr.aria-label]="'Download ' + doc.title"><mat-icon>download</mat-icon></button>
            </span>
        </div>
    </section>
</div>
