<section>
    <h3>Contest and concert material</h3>
    <mat-nav-list>
        <a mat-list-item *ngFor="let link of playlists" [href]="link.url" target="_blank" rel="noopener noreferrer">
            <mat-icon matListItemIcon>{{ link.isNew ? 'fiber_new' : 'playlist_play' }}</mat-icon>
            <span matListItemTitle>{{ link.title }}</span>
        </a>
    </mat-nav-list>
</section>

<section>
    <h3>Bagpipe care and practice</h3>
    <mat-nav-list>
        <a mat-list-item *ngFor="let link of articles" [href]="link.url" target="_blank" rel="noopener noreferrer">
            <mat-icon matListItemIcon>article</mat-icon>
            <span matListItemTitle>{{ link.title }}</span>
        </a>
    </mat-nav-list>
    <button mat-button *ngIf="hiddenArticleCount" (click)="showAllArticles = true">Show {{ hiddenArticleCount }} more</button>
</section>

<section>
    <h3>Band 3D files</h3>
    <mat-list>
        <mat-list-item *ngFor="let file of modelFiles">
            <mat-icon matListItemIcon>view_in_ar</mat-icon>
            <span matListItemTitle>{{ file.title }}</span>
            <span matListItemMeta class="actions">
                <button mat-icon-button (click)="preview(file)" matTooltip="Preview 3D model" [attr.aria-label]="'Preview ' + file.title"><mat-icon>preview</mat-icon></button>
                <button mat-icon-button (click)="download(file)" matTooltip="Download" [attr.aria-label]="'Download ' + file.title"><mat-icon>download</mat-icon></button>
            </span>
        </mat-list-item>
    </mat-list>
</section>

<section>
    <h3>Videos</h3>
    <div *ngFor="let group of videoGroups" class="video-group">
        <h4>{{ group.name }}</h4>
        <div class="video-grid">
            <a *ngFor="let video of group.videos" class="video-card" [href]="videoUrl(video)" target="_blank" rel="noopener noreferrer">
                <span class="thumb">
                    <img [src]="thumbnail(video)" [alt]="video.title" loading="lazy">
                    <mat-icon class="play">play_circle</mat-icon>
                </span>
                <span class="video-title">{{ video.title }}</span>
            </a>
        </div>
    </div>
</section>
