<div class="members">
    <header class="members-header">
        <div>
            <h1>Members</h1>
            <p class="whats-new" *ngIf="newScoreCount || newPlaylist">
                <mat-icon fontIcon="fiber_new" aria-hidden="true"></mat-icon>
                <a *ngIf="newScoreCount" routerLink="music">{{ newScoreCount }} new {{ newScoreCount === 1 ? 'score' : 'scores' }}</a>
                <span *ngIf="newScoreCount && newPlaylist" aria-hidden="true">·</span>
                <a *ngIf="newPlaylist" [href]="newPlaylist.url" target="_blank" rel="noopener noreferrer">{{ newPlaylist.title }}</a>
            </p>
        </div>
        <button mat-stroked-button (click)="logout()" class="logout-button" aria-label="Log out">
            <mat-icon>logout</mat-icon>
            <span class="logout-label">Log out</span>
        </button>
    </header>

    <nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false" mat-align-tabs="start" aria-label="Members sections">
        <a mat-tab-link *ngFor="let tab of tabs"
           [routerLink]="tab.path"
           routerLinkActive #rla="routerLinkActive"
           [active]="rla.isActive">
            <mat-icon class="tab-icon">{{ tab.icon }}</mat-icon>
            <span class="label-long">{{ tab.label }}</span>
            <span class="label-short">{{ tab.shortLabel }}</span>
        </a>
    </nav>

    <mat-tab-nav-panel #tabPanel class="tab-panel">
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
